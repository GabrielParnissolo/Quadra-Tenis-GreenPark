<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quadra de Tênis - Green Park</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <!-- ===== MOSTRADOR DE ERRO DE JS (DIAGNÓSTICO) ===== -->
  <script>
    (function(){
      function show(msg){
        var box = document.createElement("div");
        box.style.position = "fixed";
        box.style.left = "12px";
        box.style.right = "12px";
        box.style.bottom = "12px";
        box.style.zIndex = "99999";
        box.style.background = "#111827";
        box.style.color = "#fff";
        box.style.padding = "12px 14px";
        box.style.borderRadius = "14px";
        box.style.fontSize = "13px";
        box.style.whiteSpace = "pre-wrap";
        box.innerHTML = "<b>Erro de JavaScript</b>\n\n" + msg;
        document.addEventListener("DOMContentLoaded", function(){
          document.body.appendChild(box);
        });
      }

      window.addEventListener("error", function(e){
        show(
          (e.message || "Erro desconhecido") +
          (e.filename ? "\nArquivo: " + e.filename : "") +
          (e.lineno ? "\nLinha: " + e.lineno : "")
        );
      });

      window.addEventListener("unhandledrejection", function(e){
        show("Promise rejeitada:\n" + (e.reason?.message || String(e.reason)));
      });
    })();
  </script>

  <style>
    body{font-family:system-ui, sans-serif; margin:0; background:#fafafa;}
    .topbar{background:#0ea75a; color:#fff; padding:14px 16px;}
    .title{font-weight:700; font-size:18px;}
    .subtitle{font-size:12px; opacity:.9;}
    .btn{padding:10px 12px; border-radius:12px; border:1px solid #ddd;}
  </style>
</head>

<body>

  <!-- TOPO COM TESTE DE VIDA -->
  <div class="topbar">
    <div class="title">
      🎾 Quadra de Tênis
      <span id="jsStatus">(JS: 🔴)</span>
    </div>
    <div class="subtitle">Green Park</div>
  </div>

  <!-- BOTÃO DE TESTE DE CLIQUE -->
  <div style="padding:14px;">
    <button class="btn"
      onclick="document.getElementById('jsStatus').textContent='(JS: 🟢)'; alert('Clique funcionou!');">
      Testar clique JS
    </button>
  </div>

  <!-- ===== SCRIPT PRINCIPAL (DIAGNÓSTICO) ===== -->
  <script>
    // TESTE DE VIDA AUTOMÁTICO
    document.getElementById("jsStatus").textContent = "(JS: 🟢)";

    // FORÇAR ERRO CONTROLADO (se isso aparecer, o banner funciona)
    // Comente esta linha depois do teste
    throw new Error("Teste de erro proposital — se você está vendo isso, o banner funciona");
  </script>

</body>
</html>
